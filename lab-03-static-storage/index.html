<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #000, #fff);
            color: #000;
        }
        h1 {
            font-size: 4rem;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            animation: fadeInScale 3s ease-in-out infinite, slideIn 2s ease-out, colorChange 5s infinite;
        }
        @keyframes fadeInScale {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        @keyframes slideIn {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(0);
            }
        }
        @keyframes colorChange {
            0% {
                color: #000;
            }
            50% {
                color: #fff;
            }
            100% {
                color: #000;
            }
        }
    </style>
</head>
<body>
    <h1>Hola Mundo</h1>
</body>
</html>
